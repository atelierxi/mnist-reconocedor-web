<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reconocedor MNIST</title>

<link rel="stylesheet" href="{{ url_for('static_files', filename='main.css') }}">

</head>

<body>

    <main class="contenedor">

        <header class="encabezado">

            <span class="badge">
                Inteligencia Artificial · MNIST
            </span>

            <h1>
                Reconocedor de Números
            </h1>

            <p class="descripcion">
                Selecciona una imagen de un número escrito a mano
                y el modelo de inteligencia artificial intentará
                identificarlo.
            </p>

        </header>

        <section class="tarjeta">

            <form id="formulario">

                <div class="selector">

                    <label for="inputImagen">
                        Imagen del número
                    </label>

                    <input
                        type="file"
                        id="inputImagen"
                        accept="image/*"
                        required
                    >

                </div>

                <div class="preview-caja">

                    <img
                        id="preview"
                        style="display: none;"
                        alt="Previsualización de la imagen"
                    >

                    <span id="textoPreview">
                        Vista previa de la imagen
                    </span>

                </div>

                <button
                    type="submit"
                    id="btnEnviar"
                >
                    Analizar Imagen
                </button>

            </form>

            <div id="resultado"></div>

        </section>

        <footer class="footer">
            Proyecto académico · Web Services · UTS
        </footer>

    </main>

    <script>

        const inputImagen =
            document.getElementById('inputImagen');

        const preview =
            document.getElementById('preview');

        const textoPreview =
            document.getElementById('textoPreview');

        const formulario =
            document.getElementById('formulario');

        const btnEnviar =
            document.getElementById('btnEnviar');

        const divResultado =
            document.getElementById('resultado');


        inputImagen.addEventListener(
            'change',
            function () {

                const file = this.files[0];

                if (file) {

                    const reader =
                        new FileReader();

                    reader.onload =
                        function (e) {

                            preview.src =
                                e.target.result;

                            preview.style.display =
                                'block';

                            textoPreview.style.display =
                                'none';

                            divResultado.innerHTML =
                                '';
                        };

                    reader.readAsDataURL(file);
                }
            }
        );


        formulario.addEventListener(
            'submit',
            async function (e) {

                e.preventDefault();

                const file =
                    inputImagen.files[0];

                if (!file) {
                    return;
                }

                btnEnviar.disabled = true;

                btnEnviar.textContent =
                    'Analizando imagen...';

                divResultado.innerHTML =
                    '';

                const formData =
                    new FormData();

                formData.append(
                    'imagen',
                    file
                );

                try {

                    const response =
                        await fetch(
                            '/predecir',
                            {
                                method: 'POST',
                                body: formData
                            }
                        );

                    const data =
                        await response.json();


                    if (response.ok) {

                        divResultado.innerHTML = `
                            <div class="resultado-ok">

                                <span class="resultado-titulo">
                                    Número identificado
                                </span>

                                <span class="numero">
                                    ${data.numero_predicho}
                                </span>

                                <span class="confianza">
                                    Confianza:
                                    <strong>
                                        ${data.confianza}%
                                    </strong>
                                </span>

                            </div>
                        `;

                    } else {

                        divResultado.innerHTML = `
                            <div class="error">
                                Error: ${data.error}
                            </div>
                        `;
                    }

                } catch (error) {

                    divResultado.innerHTML = `
                        <div class="error">
                            Error de conexión con el servidor.
                        </div>
                    `;

                } finally {

                    btnEnviar.disabled =
                        false;

                    btnEnviar.textContent =
                        'Analizar Imagen';
                }
            }
        );

    </script>

</body>

</html>
